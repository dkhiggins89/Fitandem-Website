<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fitandem for Android</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://play.google.com/store/apps/details?id=uk.co.dkhiggins.fitandem">
  <meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=uk.co.dkhiggins.fitandem">
  <script>
    (function () {
      var target = "https://play.google.com/store/apps/details?id=uk.co.dkhiggins.fitandem";
      if (window.location.search) {
        target += "&" + window.location.search.slice(1);
      }
      window.location.replace(target + window.location.hash);
    }());
  </script>
</head>
<body>
  <p>Opening Fitandem on Google Play…</p>
